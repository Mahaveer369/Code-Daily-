<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b101b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Code It Out — Interactive CS Tutorials, DSA Practice &amp; System Design</title>
    <meta name="description" content="Code It Out: End-to-end interactive Computer Science, Web Development, DSA, SQL, and System Design learning platform with 352 modules, live code sandboxes, algorithm visualizers, and coding practice judge." />
    <meta property="og:title" content="Code It Out — Interactive CS Tutorials, DSA Practice &amp; System Design" />
    <meta property="og:description" content="Code It Out: End-to-end interactive Computer Science, Web Development, DSA, SQL, and System Design learning platform with 352 modules, live code sandboxes, algorithm visualizers, and coding practice judge." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              primary: '#2563eb',
              secondary: '#10b981',
              dark: '#0b101b',
              card: '#121a2b',
            },
            animation: {
              fadeIn: 'fadeIn 0.2s ease-out forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(4px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0b101b;
        color: #f8fafc;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      input, textarea {
        -webkit-user-select: text;
        -moz-user-select: text;
        -ms-user-select: text;
        user-select: text;
      }
      img, svg {
        -webkit-user-drag: none;
        user-drag: none;
      }
      @media print {
        html, body {
          display: none !important;
        }
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0b101b;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
    </style>
  </head>
  <body oncontextmenu="return false;" oncopy="return false;" oncut="return false;" ondragstart="return false;">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
